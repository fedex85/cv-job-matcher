line-length = 120
target-version = "py312"
extend-exclude = ["venv", ".venv", "models"]

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]   # B008: FastAPI usa File()/Form() por defecto; E501: líneas largas permitidas

[lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
